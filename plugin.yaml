id: schedule
name: 日程
version: 0.8.0
description: 按作息自动生成每天的日程：定点生成、跨天补生成、可按已配置模型润色空档；天气子插件提供实时天气、逐小时降水与预报；衣柜子插件按日程/天气配穿搭（独立安装，服装图走公共 CDN）；待办池自动填空档，提醒可按事项分级、休息日静音并稍后提醒；支持只读 ICS 下载与带令牌的本机订阅；旅行块附交通、住宿、清单、预算和坏天气备选；可选法定节假日、调休、学生假期与自定义周末，支持导入 ICS 节假日、改周起始日、导出/导入配置；支持双周 / 每月第 N 个周几 / 每月最后 / 例外日期的重复规则，生病或临时变化可一键生成当天异常日版本，并按完成/跳过记录生成周复盘；人格可在睡前按当天日程、天气和穿搭自动写日记，可切换或自定义文风，并按人格隔离保存、由同一人格主动读取；每轮把当前/下一项注入当前人格的对话上下文；关键节点可通过已配置渠道主动提醒。
apiVersion: "1.0.0"
depends: [tools, web, llm, models]
sub: [weather, wardrobe]
console:
  groupChildren: true
repository: https://github.com/FelixTaXk/whalelife-community-schedule
