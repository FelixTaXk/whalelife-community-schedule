id: schedule
name: 日程
version: 0.5.0
description: 按作息自动生成每天的日程：定点生成、跨天补生成、可按已配置模型润色空档；天气子插件提供实时天气与预报；识别法定节假日、调休和学生寒暑假/春秋假，假期不排正事；周末短途、长假远途旅行，可按地点池、指定目的地或 AI 选择；每轮把当前/下一项注入迟宝的对话上下文；关键节点可通过 QQ 主动提醒。
apiVersion: "1.0.0"
depends: [tools, web, llm, models]
sub: [weather, wardrobe]
console:
  groupChildren: true
repository: https://github.com/FelixTaXk/whalelife-community-schedule
