id: schedule
name: 日程
version: 0.6.0
description: 按作息自动生成每天的日程：定点生成、跨天补生成、可按已配置模型润色空档；天气子插件提供实时天气与预报；可选法定节假日、调休、学生假期与自定义周末；周末短途、长假远途旅行，可按地点池、指定目的地或 AI 选择；支持双周 / 每月第 N 个周几 / 每月最后 / 例外日期的重复规则，生病或临时变化可一键生成当天异常日版本，并按完成/跳过记录生成周复盘；每轮把当前/下一项注入当前人格的对话上下文；关键节点可通过已配置渠道主动提醒。
apiVersion: "1.0.0"
depends: [tools, web, llm, models]
sub: [weather]
console:
  groupChildren: true
repository: https://github.com/FelixTaXk/whalelife-community-schedule
