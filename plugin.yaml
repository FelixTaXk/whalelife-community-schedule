id: schedule
name: 日程
version: 0.5.2
description: 按作息自动生成每天的日程：定点生成、跨天补生成、可按已配置模型润色空档；天气子插件提供实时天气与预报；可选法定节假日、调休、学生假期与自定义周末；周末短途、长假远途旅行，可按地点池、指定目的地或 AI 选择；每轮把当前/下一项注入当前人格的对话上下文；关键节点可通过已配置渠道主动提醒。
apiVersion: "1.0.0"
depends: [tools, web, llm, models]
sub: [weather]
console:
  groupChildren: true
repository: https://github.com/FelixTaXk/whalelife-community-schedule
